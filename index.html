    <script>
      (function () {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            Object.defineProperty(window, 'fetch', {
              value: originalFetch.bind(window),
              writable: true,
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Ignore if descriptor cannot be modified
        }
        window.addEventListener(
          'error',
          function (event) {
            if (
              event &&
              event.message &&
              event.message.indexOf('Cannot set property fetch') !== -1
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
